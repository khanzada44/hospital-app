<div class="login-wrapper">
  <div class="login-container">
    
    <!-- Left Side: Login Form -->
    <div class="form-section">
      <h2>Welcome Back</h2>
      <p>Please login to your account</p>

      <mat-form-field appearance="outline">
        <mat-label>Email </mat-label>
        <input matInput placeholder="Enter your email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password </mat-label>
        <input matInput type="password" placeholder="Enter your password">
      </mat-form-field>

      <button mat-raised-button color="primary" class="login-btn">Login</button>
    </div>

    <!-- Right Side: Image -->
    <div class="image-section">
      <img src="assets/hospital-login-page.png" alt="Login Illustration">
    </div>

  </div>
</div>
